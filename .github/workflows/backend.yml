name: Backend maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read backend status or refresh the site's CDN entry pages
        required: true
        default: status
        type: choice
        options:
          - status
          - refresh

permissions:
  contents: read

concurrency:
  group: fergusonhealth-production
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run maintenance operation
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          OPERATION: ${{ inputs.operation }}
        run: python3 backend.py "$OPERATION"
